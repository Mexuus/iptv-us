# Threadfin: M3U -> HDHomeRun proxy so Plex Live TV & DVR can use the playlist.
# Deploy on ZimaOS via App Store -> Custom Install -> Import docker-compose.
#
# Set TZ, and set PUID/PGID to a user that owns ./data (run `id` on the host).
services:
  threadfin:
    image: fyb3roptik/threadfin:latest
    container_name: threadfin
    ports:
      - "34400:34400"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /DATA/AppData/threadfin/conf:/home/threadfin/conf
      - /DATA/AppData/threadfin/temp:/tmp/threadfin:rw
    restart: unless-stopped
